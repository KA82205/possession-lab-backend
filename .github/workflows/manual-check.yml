name: Possession Lab backend check

# An hourly wake-up checks official finals and refreshes matchups that are due.
# The Site itself enforces tip-off locks and decides when simulations are needed.
on:
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Forecast update or read-only connection check
        required: true
        type: choice
        default: dry-run
        options:
          - dry-run
          - full

permissions:
  contents: read

concurrency:
  group: possession-lab-scheduler
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      SITE_ORIGIN: https://possession-lab-nba-2026.ka82205.chatgpt.site
      SITE_BYPASS_TOKEN: ${{ secrets.SITE_BYPASS_TOKEN }}
      DRY_RUN: ${{ inputs.mode == 'dry-run' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify forecast backend
        run: node scheduler.mjs
