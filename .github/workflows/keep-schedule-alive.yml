name: Keep forecast schedule active

# GitHub disables scheduled workflows in public repositories after 60 days
# without repository activity. Refresh the default branch twice a month.
# This workflow has no access to the site's private API token.
on:
  schedule:
    - cron: '37 9 1,20 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: possession-lab-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - name: Refresh repository activity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --allow-empty -m 'chore: keep scheduled forecasts active [skip ci]'
          git push origin "HEAD:${GITHUB_REF_NAME}"
